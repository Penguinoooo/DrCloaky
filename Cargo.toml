[package]
name = "drcloaky"
version = "0.1.0"
edition = "2024"

[lib]
name = "drcloaky_hook"
crate-type = ["cdylib"]

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader"] }
